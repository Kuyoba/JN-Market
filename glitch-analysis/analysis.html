<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>glitch analysis</title>
<style>
  body { margin: 0; background: #000; }
  video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: contain; }
  canvas { display: none; }
</style>
</head>
<body>
<video id="v" muted playsinline preload="auto" src="video.mp4"></video>
<canvas id="c"></canvas>
<script>
var v = document.getElementById('v');
var c = document.getElementById('c');
var ctx = c.getContext('2d', { willReadFrequently: true });
window.__ready = false;
window.__duration = 0;
window.__size = { w: 0, h: 0 };

v.addEventListener('loadedmetadata', function () {
  window.__duration = v.duration;
  c.width = v.videoWidth;
  c.height = v.videoHeight;
  window.__size = { w: v.videoWidth, h: v.videoHeight };
  window.__ready = true;
});

function frameAt(t) {
  return new Promise(function (resolve) {
    function seek() {
      if (Math.abs(v.currentTime - t) < 0.02) { draw(); return; }
      var done = false;
      v.addEventListener('seeked', function h() {
        v.removeEventListener('seeked', h);
        if (done) return;
        done = true;
        draw();
      });
      v.currentTime = t;
    }
    function draw() {
      ctx.drawImage(v, 0, 0, c.width, c.height);
      resolve();
    }
    if (v.readyState >= 2) { seek(); }
    else { v.addEventListener('loadeddata', function h() { v.removeEventListener('loadeddata', h); seek(); }); }
  });
}

// count pixels close to the badge navy (#21158f) inside a region
function navyIn(x0, y0, x1, y1) {
  var w = c.width, h = c.height;
  var px = Math.round(x0 * w), py = Math.round(y0 * h);
  var pw = Math.max(1, Math.round(x1 * w) - px), ph = Math.max(1, Math.round(y1 * h) - py);
  var data = ctx.getImageData(px, py, pw, ph).data;
  var n = 0;
  for (var i = 0; i < data.length; i += 4) {
    var r = data[i], g = data[i + 1], b = data[i + 2];
    if (b > 100 && b - r > 65 && g < 55) n++;
  }
  return n;
}

window.__analyze = async function (step, from, to) {
  var out = [];
  for (var t = from; t < to; t += step) {
    await frameAt(t);
    out.push({
      t: Math.round(t * 100) / 100,
      leftBottom: navyIn(0.05, 0.55, 0.45, 0.98),
      rightBottom: navyIn(0.55, 0.55, 0.95, 0.98)
    });
  }
  return JSON.stringify(out);
};

window.__frame = async function (t) {
  await frameAt(t);
  return JSON.stringify({ t: t, w: c.width, h: c.height });
};

window.__show = async function (t) {
  await frameAt(t);
  v.pause();
  return JSON.stringify({ shown: t, vw: v.videoWidth, vh: v.videoHeight });
};
</script>
</body>
</html>
