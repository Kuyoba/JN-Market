
<section class="form">
    <button type="button" class="close" aria-label="Fermer">
        <span class="fi-rr-cross icon"></span>
    </button>

    <div class="description">
        <h2 id="form-title">Envoyez-nous un message</h2>
        <p id="form-desc">nous répondons sous un jour ouvrable</p>
    </div>

    <form novalidate name="form" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="46418258-e9af-4abb-9d59-4e5377cde65a">
        <!-- honeypot: bots fill hidden fields, Web3Forms silently drops them -->
        <input type="checkbox" name="botcheck" class="hidden" tabindex="-1" aria-hidden="true" autocomplete="off">
        <div class="input-group">
            <label for="name">Nom</label>
            <input type="text" id="name" name="name" required aria-describedby="name-res">
            <span id="name-res" aria-live="polite"></span>
        </div>

        <div class="row">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required aria-describedby="email-res">
                <span id="email-res" aria-live="polite"></span>
            </div>

            <div class="input-group">
                <label for="phone">Téléphone</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    required
                    aria-describedby="phone-res"
                    pattern="[+]?[0-9][0-9 .\(\)\-]{6,19}"
                    title="Numéro international, ex. +216 71 234 567"
                >
                <span id="phone-res" aria-live="polite"></span>
            </div>
        </div>

        <div class="input-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" required aria-describedby="message-res"></textarea>
            <span id="message-res" aria-live="polite"></span>
        </div>

        <div class="button-group">
            <button type="submit">
                Envoyer le message
                <span class="fi-rr-arrow-right"></span>
            </button>

            <button type="reset">Annuler</button>
        </div>
        <p id="form-error" class="form-error hidden" role="alert"></p>
    </form>

    <div class="form-success hidden">
        <span class="fi-rr-check"></span>
        <h3>Message envoyé !</h3>
        <p>merci de nous avoir contactés - nous répondons sous un jour ouvrable.</p>
        <button type="button" class="success-close">fermer</button>
    </div>
</section>
